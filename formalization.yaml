version: "v0.4"

project:
  name: algebraic-groups
  description: >-
    For any commutative K and same-universe finite linearly ordered n, the
    represented upper-triangular scheme T over Spec K has a categorical
    underlying-scheme U-first product U x D with diagonal scheme D and its
    actual unitriangular identity fiber U. The forward map is i(u)e(d);
    its inverse uses the diagonal projection and right normalization.
    Represented diagonal conjugation gives arbitrary-test twisted multiplication
    (u,d)*(u',d')=(u*alpha(d,u'),d*d'), not a canonical direct-product group law.
    All commutative K-algebra points, including zero/nonreduced rings, and
    empty indices and noninjective coefficient maps are within scope.
    The split identity-fiber, finite diagonal G_m product and earlier
    triangular, unitriangular and common-zero APIs remain available.
    The complete preceding P description follows unchanged as dated
    2026-09-29 historical evidence:
    Represented upper-triangular group schemes over fixed Spec K admit a
    categorical U-first coordinate isomorphism and a diagonal conjugation
    action on their actual unitriangular kernel. The forward arrow is i(u)e(d),
    and arbitrary-test multiplication is twisted by the represented action;
    no direct-product group law or arbitrary-base change is asserted.
    Original isolated U-first evidence belongs to its donor graph, not to
    this destination. The entire preceding W description follows unchanged
    as a dated 2026-09-29 historical snapshot:
    This source-independent library includes an upper-triangular projection
    with diagonal section and the actual unitriangular scheme-theoretic
    identity fiber over every commutative K and finite linearly ordered n:
    coordinate pushout and scheme, over-base and group-scheme pullbacks,
    closed inclusion, GL compatibility and all-algebra point formulas.
    The separately published finite diagonal G_m product and earlier
    triangular, unitriangular and common-zero APIs are also available.
    The complete W description follows as dated 2026-09-29 history;
    its candidate lifecycle language is not a current publication label:
    This library implements upper-triangular diagonal splitting with genuine
    U identity-fiber pullbacks over any commutative ring and finite ordered
    index, a finite diagonal G_m categorical product and published predecessors.
    Original split C fd4b61f91e94c2608875d606fb69e80d1c247d3d passed
    native 1063/review 4917; product code A ad5bff948f563bb9df49825f55dfcc8fcace8130
    has separate native 1058/review 4912. These do not establish combined-tree
    checks, fresh review, acceptance or publication. The 2026-09-29 static
    renewal performed no computation. Historical N preparation text and the
    complete D scalar (including shared B only once) follow below:
    Dated 2026-09-29 prospective split-kernel and diagonal-product union:
    the unchanged original split producer and client expose the section of
    T to D, the genuine identity-fiber pullbacks identifying U, its closed
    inclusion and all-commutative-algebra native point formulas. This static
