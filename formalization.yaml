version: "v0.4"

project:
  name: algebraic-groups
  description: >-
    Reusable algebraic-group and group-scheme constructions, functors of points,
    coordinate Hopf algebras, components, reduction, smoothness, quotient-sheaf
    interfaces, finite upper-unitriangular Hopf quotients, group schemes and
    the geometry of their underlying schemes,
    and supporting commutative-algebra and scheme theory.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

repository:
  role: substantive-development

sources:
  - title: Algebraic Groups
    authors:
      - James S. Milne
    type: book
    location: 2017 edition
    relationship: background
    note: >-
      Mathematical background for algebraic groups and group schemes. This
      library is organized independently of the book and does not claim complete
      coverage. Source text is not bundled and no source-author endorsement is
      claimed. Exact passage correspondence remains outside this deliverable.
  - title: Algebraic-group and affine-localization project constructions
    authors:
      - Formal Frontier Agents
    type: original project proofs and earlier project research
    relationship: adapts
    note: >-
      Reusable Lean implementations include original project proofs and internal
      adaptations of earlier source-repository research. Lattice's earlier
      clopen-rank localization research is distinguished from its later library
      assembly; separate Worker A/B implementations and Anchor's integration
      contributions are credited in README.md. This bibliography is not a
      blanket determination of expression origin or redistribution clearance.

related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4/tree/83abb3e776bdefcbc447a1e44d0debe4010039e5
    relationship: builds-on
    note: >-
      Pinned external dependency for commutative algebra, linear algebra,
      category theory, schemes and group objects. The exact Lake graph also
      declares separately maintained scheme-properties, finite-etale-algebras
      and coherent-modules dependencies; their credit and licenses are distinct.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formal Frontier AI agents used Lean and Lake with pinned mathlib and
        separately attributed non-author agent development review.
  notes: >-
    AI-assisted development under human project direction. No human mathematical
    review, model identity, elapsed-time total or expenditure is asserted.

status:
  scope: >-
    Reusable coordinate and functor-of-points APIs for additive, multiplicative,
    vector, finite-matrix general-linear and other explicitly constructed group
    schemes; the finite upper-unitriangular Hopf quotient, its free strict-upper
    polynomial presentation, finite-type affine group scheme, closed inclusion
    into GL and multiplicatively natural functor of points, including empty
    indices and zero rings; the finite general-linear determinant character to the multiplicative
    group; arbitrary-module automorphism functors and their chosen-finite-basis
    representation by the existing general-linear scheme; conditional component,
    reduction, smoothness and quotient-sheaf interfaces; and supporting algebra
    and scheme results. Explicit finiteness, field, rank, geometric-connectedness
    and reducedness hypotheses remain as stated in the formal APIs. General
    finite-flat quotient effectivity, a canonical basis-free arbitrary-module
    automorphism group scheme and arbitrary-module determinant scheme morphism
    are not claimed. The library includes a one-pivot finite-matrix determinant
    section (requiring a chosen index), the determinant-one finite special-linear
    Hopf quotient and group scheme,
    and its actual scheme/group-scheme kernel. Finite-free scalar-extension
    determinant-one automorphism functors admit canonical coefficient change,
    agreement with GL(V), and chosen-basis comparison with the represented
    finite matrix SL points, including change-of-basis laws. Finite matrix GL
    and SL coordinate algebras and their actual Spec structure morphisms are
    smooth over arbitrary commutative bases, including empty indices and zero
    rings. Their nonempty normalization is an algebra retract, not a group/Hopf
    map. The split-kernel product supplies an underlying-object isomorphism
    for any genuine group-object kernel square and arbitrary underlying-object
    section, with section-first multiplication; it is not a direct-product
    group-object isomorphism. For finite decidable matrix indices with a chosen
    pivot, the actual determinant-one kernel gives an underlying-scheme product
    SL(n,K) × Gm,K isomorphic to GL(n,K), an actual determinant triangle and
    smoothness of the actual determinant scheme morphism over arbitrary
    commutative rings, including zero rings and rank one. Rank zero,
    a canonical basis-free SL(V) scheme, arbitrary-projective-module SL,
    assumed flatness, faithful flatness and
    a canonical direct-product group-object or group-scheme decomposition are
    not claimed. A genuine group-object kernel admits pullback-defined
    conjugation by an arbitrary section; a multiplicative section gives its
    internal left-action and section-first twisted product law. For a finite
    matrix determinant with chosen pivot, diagonal conjugation restricts to
    its actual special-linear kernel and has a native matrix readback over
    every commutative coefficient algebra; inverses are formed in units before
    coercion. Rank zero remains outside this chosen-pivot construction.
    For finite decidable indices, the actual GL and SL coordinate rings are
    domains and their underlying schemes integral over domain bases; their
    structure maps are geometrically integral over every commutative base,
    including the zero ring's vacuous field fibers. Over fields their coordinate
    rings and underlying schemes have dimensions N squared for GL and natural
    N squared minus one for SL, including the separate rank-zero case. A generic
    multivariate-polynomial rational-point height result needs no decidable
    equality on its finite index type and allows distinct universes.
    Complete source formalization is not claimed. No diagonal or full triangular
    group scheme, positive-rank or nonzero-ring assumption, or base-ring-change
    naturality is added by the upper-unitriangular construction. The accepted
    geometry code identifies the underlying unitriangular scheme with affine space
    over the base and proves pullback readbacks, coordinate smoothness and finite
    presentation, relative smoothness and geometric integrality over every
    commutative ring (including the zero ring), absolute integrality under
    IsDomain and numeric ring/scheme dimensions under Field. This is not an
    additive group-scheme isomorphism, an unconditional absolute integrality
    or numeric dimension result, nor a base-change/nilpotence/Lie theory.
    The coordinate/group predecessor's destination build, complete transitive
    standard-axiom audit, independent non-author review and maintainer code
    acceptance are complete, as is its separate official publication. The
    geometry transfer's 135-module both-target build and complete actual-origin
    private/generated-inclusive standard-axiom audit succeeded in native job 718.
    Independent destination review and maintainer code acceptance/protected main
    integration cover commit 31492d5a182c21f40af029121718ceca8085568a.
    Its separate independent release review and official geometry publication
    remain pending; no source-coverage decision follows from this transfer.
