version: "v0.4"

project:
  name: algebraic-groups
  description: >-
    Reusable Lean formalization of native matrix point groups, finite
    algebraic group schemes and their coordinate algebras. The library covers
    unitriangular and upper-triangular groups, diagonal products, split
    kernels, closed unitriangular stages and their underlying affine-space
    presentations, finite additive products and positive-stage underlying
    projections and sections, unitriangular scalar base change and coherence, and selected
    dimension and geometric results. Precise hypotheses and exclusions are
    documented in README.md and the focused mathematical guides. This is not
    a complete formalization of any cited source.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

repository:
  role: substantive-development

sources:
  - title: Algebraic Groups
    authors:
      - James S. Milne
    type: book
    location: 2017 edition
    relationship: background
    note: >-
      Mathematical background for algebraic groups and group schemes. This
      library is organized independently of the book and does not claim complete
      coverage. Source text is not reproduced and no source-author endorsement
      is claimed.
  - title: Original algebraic-group and affine-localization constructions
    authors:
      - Formal Frontier Agents
    type: original project proofs and earlier project research
    relationship: adapts
    note: >-
      Original project proofs and adaptations of prior project research are
      implemented as reusable library APIs. Bibliographic and contributor
      credits appear in CREDITS.md. This entry is not third-party rights clearance.

related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4/tree/83abb3e776bdefcbc447a1e44d0debe4010039e5
    relationship: builds-on
    note: >-
      Pinned external dependency for commutative algebra, linear algebra,
      category theory, schemes and group objects. The exact Lake graph also
      declares separately maintained scheme-properties, finite-etale-algebras
      and coherent-modules dependencies; their credit and licenses are distinct.
  - id: https://github.com/FormalFrontier/general-linear-groups/tree/ad7c50a0523441116537fb1d6e3c8d2a665af1fc
    relationship: builds-on
    note: >-
      Exact official direct dependency supplying the general-linear elementary
      matrix unit and ordered elementary commutator identity. This library
      transfers that identity into the native unitriangular point group and
      derives its sharp nilpotency class using its own central-filtration bound.
      General-linear-groups retains distinct contributors, rights and license.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formal Frontier AI agents used Lean and Lake with pinned dependencies.
  notes: >-
    AI agents developed mathematical proofs and ordinary-import clients.

status:
  scope: >-
    This repository contains reusable algebraic-group, group-scheme and
    coordinate-algebra definitions and results, with focused ordinary-import
    clients. Native unitriangular point groups have central, lower-central
    and derived series, superdiagonal quotient and exponent results with the
    hypotheses described in their guides. Native closed superdiagonal stages
    have Hopf coordinate quotients, multiplicative points, a polynomial-algebra
    presentation and underlying over-scheme affine-space isomorphisms over
    arbitrary commutative bases. These stages are normal; positive stages have
    primitive group-scheme coordinate projections whose successor is their
    underlying over-scheme kernel; the positive-stage projection has a
    specified underlying over-scheme section, without a quotient or a
    group-scheme splitting claim. The literal finite product of additive
    group schemes has underlying polynomial affine space over arbitrary
    commutative rings, preserving actual projections (including empty
    indices and zero rings).
    Diagonal, triangular, GL and SL
    constructions include selected products, representations, finite
    geometry and dimension results. Unitriangular coordinate algebras and
    group schemes have base-change and identity/tower coherence comparisons.
    The library is not a blanket arbitrary-base classification or full
    quotient-effectivity theory,
    or complete formalization of Milne's book. Read exact limitations with
    each mathematical guide.
