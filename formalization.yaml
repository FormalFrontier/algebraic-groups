version: "v0.4"

project:
  name: algebraic-groups
  description: >-
    Reusable algebraic-group and group-scheme constructions, functors of points,
    coordinate Hopf algebras, components, reduction, smoothness, quotient-sheaf
    interfaces, finite upper-unitriangular Hopf quotients, group schemes and
    the geometry of their underlying schemes, central filtrations and successive
    quotients of their native point groups, exact nilpotency classes of finite
    native unitriangular groups over nontrivial commutative rings, the
    all-stage lower central series and positive-stage elementary generation
    of native unitriangular groups, exact positive-stage commutators and their
    native derived series over any commutative ring, generic strictly
    upper-triangular matrix nilpotence and sharp prime-power exponent bounds
    for native finite unitriangular point groups, a finite diagonal GL subgroup
    and closed finite-type affine group scheme with fixed-base natural points, and
    supporting commutative-algebra and scheme theory.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

repository:
  role: substantive-development

sources:
  - title: Algebraic Groups
    authors:
      - James S. Milne
    type: book
    location: 2017 edition
    relationship: background
    note: >-
      Mathematical background for algebraic groups and group schemes. This
      library is organized independently of the book and does not claim complete
      coverage. Source text is not bundled and no source-author endorsement is
      claimed. Exact passage correspondence remains outside this deliverable.
  - title: Algebraic-group and affine-localization project constructions
    authors:
      - Formal Frontier Agents
    type: original project proofs and earlier project research
    relationship: adapts
    note: >-
      Reusable Lean implementations include original project proofs and internal
      adaptations of earlier source-repository research. Lattice's earlier
      clopen-rank localization research is distinguished from its later library
      assembly; separate Worker A/B implementations and Anchor's integration
      contributions are credited in README.md. This bibliography is not a
      blanket determination of expression origin or redistribution clearance.

related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4/tree/83abb3e776bdefcbc447a1e44d0debe4010039e5
    relationship: builds-on
    note: >-
      Pinned external dependency for commutative algebra, linear algebra,
      category theory, schemes and group objects. The exact Lake graph also
      declares separately maintained scheme-properties, finite-etale-algebras
      and coherent-modules dependencies; their credit and licenses are distinct.
  - id: https://github.com/FormalFrontier/general-linear-groups/tree/ad7c50a0523441116537fb1d6e3c8d2a665af1fc
    relationship: builds-on
    note: >-
      Exact official direct dependency supplying the general-linear elementary
      matrix unit and ordered elementary commutator identity. This library
      transfers that identity into the native unitriangular point group and
      derives its sharp nilpotency class using its own central-filtration bound.
      General-linear-groups retains distinct contributors, rights and license.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formal Frontier AI agents used Lean and Lake with pinned mathlib and
        separately attributed non-author agent development review.
  notes: >-
    AI-assisted development under human project direction. No human mathematical
    review, model identity, elapsed-time total or expenditure is asserted.

