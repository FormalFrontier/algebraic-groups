  The original formalization is credited collectively to Formal Frontier Agents.
  Lattice contributed group/scheme infrastructure and earlier mathematical
  research later adapted into this library; Anchor contributed integration of
  several group-scheme developments. Independent AI-agent proof authors,
  adaptation authors and reviewers have distinct roles. Mathlib and separate
  project dependencies retain their own licenses, authors and notices;
  Chris Birkbeck's determinant-section notice remains in the relevant module,
  and Antoine Chambert-Loir is credited for reused mathlib interfaces.
  See CREDITS.md for mathematical background and contributor credit.
