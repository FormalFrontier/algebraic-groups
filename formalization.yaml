version: "v0.4"

project:
  name: algebraic-groups
  description: >-
    Reusable Lean formalization of matrix point groups, finite
    algebraic group schemes and their coordinate algebras. The library covers
    unitriangular and upper-triangular groups, diagonal products, split
    kernels, closed unitriangular stages and their underlying affine-space
    presentations, finite additive products and positive-stage underlying
    projections and sections, unitriangular scalar base change and coherence, and selected
    dimension and geometric results. Coalgebra APIs include field subcoalgebras
    and finite-dimensional containment, right comodules and finitely generated
    subcomodule containment, coefficient matrix units, counit ranges and
    idempotent principal ideal constructors; split free presentations give
    finite tensor coordinates. Precise hypotheses and exclusions are
    documented in README.md and the focused mathematical guides. This is not
    a complete formalization of any cited source.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

repository:
  role: substantive-development

sources:
  - title: Hopf Algebras
    authors:
      - Moss E. Sweedler
    type: book
    location: W. A. Benjamin, 1969
    relationship: background
    note: >-
      Bibliographic credit for the classical field coalgebra theorem and
      coefficient-coalgebra method. The projective-ambient commutative-semiring
      result asserts first-factor tensor-image closure, not two-factor
      closure over every semiring. No complete source coverage is claimed.
  - title: Algebraic Groups
    authors:
      - James S. Milne
    type: book
    location: 2017 edition
    relationship: background
    note: >-
      Mathematical background for algebraic groups and group schemes. This
      library is organized independently of the book and does not claim complete
      coverage. Source text is not reproduced and no source-author endorsement
      is claimed. The fundamental theorem of coalgebras over a field is a
      mathematical antecedent for the finite-containment API.
  - title: Original algebraic-group and affine-localization constructions
    authors:
      - Formal Frontier Agents
    type: original project proofs and earlier project research
    relationship: adapts
    note: >-
      Original project proofs and adaptations of prior project research are
      implemented as reusable library APIs. Bibliographic and contributor
      credits appear in CREDITS.md. This entry is not third-party rights clearance.

related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4/tree/2cabef97b63d3275776b8b060d802de6a6fa1055
    relationship: builds-on
    note: >-
      Pinned external dependency for commutative algebra, linear algebra,
      category theory, schemes and group objects. The exact Lake graph also
      declares separately maintained scheme-properties, finite-etale-algebras
      and coherent-modules dependencies; their credit and licenses are distinct.
      Mathlib also supplies submodule, coalgebra, tensor-map, vector-space,
      flatness and module-finiteness APIs for field subcoalgebras.
  - id: https://github.com/TauCetiProject/TauCeti
    relationship: builds-on
    note: >-
      Canonical subcoalgebras, comodules, Hopf algebras, matrix and diagonalizable
      group schemes supply the shared foundations. This project retains its
      additional containment, presentation, kernel, product and geometry results
      on those carriers. The manifest pins the exact dependency revision;
      docs/TAUCETIFY.md links its published constructor and universe refactors.
  - id: https://github.com/FormalFrontier/general-linear-groups/tree/8b3b07bf2744a870b53934542e4c5ed383765bd6
    relationship: builds-on
    note: >-
      Exact direct dependency supplying the general-linear elementary
      matrix unit and ordered elementary commutator identity. This library
      transfers that identity into the unitriangular point group and
      derives its sharp nilpotency class using its own central-filtration bound.
      General-linear-groups retains distinct contributors, rights and license.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formal Frontier AI agents used Lean and Lake with pinned dependencies.
  notes: >-
    AI agents developed mathematical proofs and ordinary-import clients.

status:
  scope: >-
    This repository contains reusable algebraic-group, group-scheme and
    coordinate-algebra definitions and results, with focused ordinary-import
    clients. Shared foundations are imported from Mathlib and Tau Ceti; the
    main results below list declarations owned by this project. Every finite subset of a coalgebra over a commutative semiring
    with projective ambient module lies in a module-finitely-generated submodule
    with every-member first-factor tensor-image closure, without ambient finite
    generation. Free modules are included. Over a field,
    finite subsets have two-factor tensor-image containment. The restricted
    coalgebra structures over a field are provided by the subcoalgebra API.
    Finite biorthogonal
    ambient coordinates give coefficient-comultiplication and counit laws.
    Finite Hopf coefficient matrices satisfying both matrix laws are units
    with entrywise antipode inverse, including empty indices. For every
    coalgebra over a commutative semiring, the counit range is an idempotent
    ideal acting on the top submodule with image top. Idempotent principal
    ideals have explicit coalgebra constructors, including nonfree examples.
    Arbitrary split free presentations give finite tensor reconstruction and
    all-index contraction formulas without assuming freeness or finite
    generation of the presented module. Unitriangular point groups have
    central, lower-central and derived series, superdiagonal quotient and exponent results with the
    hypotheses described in their guides. Closed superdiagonal stages
    have Hopf coordinate quotients, multiplicative points, a polynomial-algebra
    presentation and underlying over-scheme affine-space isomorphisms over
    arbitrary commutative bases. These stages are normal; positive stages have
    primitive group-scheme coordinate projections whose successor is their
    underlying over-scheme kernel; the positive-stage projection has a
    specified underlying over-scheme section, without a quotient or a
    group-scheme splitting claim. The literal finite product of additive
    group schemes has underlying polynomial affine space over arbitrary
    commutative rings, preserving actual projections (including empty
    indices and zero rings).
    Diagonal, triangular, GL and SL
    constructions include selected products, representations, finite
    geometry and dimension results. Unitriangular coordinate algebras and
    group schemes have base-change and identity/tower coherence comparisons.
    Over a field, subcoalgebras are subspaces whose members' comultiplication
    lies in the image of their tensor square. Their subtypes carry the restricted
    coalgebra, with bundled inclusions and unique codomain restriction for
    homomorphisms. Every finitely generated subspace, and every finite subset,
    lies in a finite-dimensional subcoalgebra. No finite-dimensional ambient
    module or algebra structure is required, and no least finite closure is
    asserted.
    The library is not a blanket arbitrary-base classification or full
    quotient-effectivity theory,
    or complete formalization of Milne's book. Read exact limitations with
    each mathematical guide.
