status:
  scope: >-
    Reusable coordinate and functor-of-points APIs for additive, multiplicative,
    vector, finite-matrix general-linear and other explicitly constructed group
    schemes; the finite general-linear determinant character to the multiplicative
    group; arbitrary-module automorphism functors and their chosen-finite-basis
    representation by the existing general-linear scheme; conditional component,
    reduction, smoothness and quotient-sheaf interfaces; and supporting algebra
    and scheme results. Explicit finiteness, field, rank, geometric-connectedness
    and reducedness hypotheses remain as stated in the formal APIs. General
    finite-flat quotient effectivity, a canonical basis-free arbitrary-module
    automorphism group scheme and arbitrary-module determinant scheme morphism
    are not claimed. The library includes a one-pivot finite-matrix determinant
    section (requiring a chosen index), the determinant-one finite special-linear
    Hopf quotient and group scheme,
    and its actual scheme/group-scheme kernel. Finite-free scalar-extension
    determinant-one automorphism functors admit canonical coefficient change,
    agreement with GL(V), and chosen-basis comparison with the represented
    finite matrix SL points, including change-of-basis laws. Finite matrix GL
    and SL coordinate algebras and their actual Spec structure morphisms are
    smooth over arbitrary commutative bases, including empty indices and zero
    rings. Their nonempty normalization is an algebra retract, not a group/Hopf
    map. The split-kernel product supplies an underlying-object isomorphism
    for any genuine group-object kernel square and arbitrary underlying-object
    section, with section-first multiplication; it is not a direct-product
    group-object isomorphism. For finite decidable matrix indices with a chosen
    pivot, the actual determinant-one kernel gives an underlying-scheme product
    SL(n,K) × Gm,K isomorphic to GL(n,K), an actual determinant triangle and
    smoothness of the actual determinant scheme morphism over arbitrary
    commutative rings, including zero rings and rank one. Rank zero,
    a canonical basis-free SL(V) scheme, arbitrary-projective-module SL,
    assumed flatness, faithful flatness and
    a canonical direct-product group-object or group-scheme decomposition are
    not claimed. A genuine group-object kernel admits pullback-defined
    conjugation by an arbitrary section; a multiplicative section gives its
    internal left-action and section-first twisted product law. For a finite
    matrix determinant with chosen pivot, diagonal conjugation restricts to
    its actual special-linear kernel and has a native matrix readback over
    every commutative coefficient algebra; inverses are formed in units before
    coercion. Rank zero remains outside this chosen-pivot construction.
    Complete source formalization is not claimed.

