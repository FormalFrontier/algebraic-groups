automation:
  methods:
    - method: agent
      tool_setup: >-
        Formal Frontier AI agents used Lean and Lake with pinned mathlib and
        separately attributed non-author agent development review.
  notes: >-
    AI-assisted development under human project direction. No human mathematical
    review, model identity, elapsed-time total or expenditure is asserted.

status:
  scope: >-
    Reusable coordinate and functor-of-points APIs for additive, multiplicative,
    vector, finite-matrix general-linear and other explicitly constructed group
    schemes; the finite general-linear determinant character to the multiplicative
    group; arbitrary-module automorphism functors and their chosen-finite-basis
    representation by the existing general-linear scheme; conditional component,
    reduction, smoothness and quotient-sheaf interfaces; and supporting algebra
    and scheme results. Explicit finiteness, field, rank, geometric-connectedness
    and reducedness hypotheses remain as stated in the formal APIs. General
    finite-flat quotient effectivity, a canonical basis-free arbitrary-module
    automorphism group scheme and arbitrary-module determinant scheme morphism
    are not claimed. The library includes a one-pivot finite-matrix determinant
    section (requiring a chosen index), the determinant-one finite special-linear
    Hopf quotient and group scheme,
    and its actual scheme/group-scheme kernel. Finite-free scalar-extension
    determinant-one automorphism functors admit canonical coefficient change,
    agreement with GL(V), and chosen-basis comparison with the represented
    finite matrix SL points, including change-of-basis laws. Finite matrix GL
    and SL coordinate algebras and their actual Spec structure morphisms are
    smooth over arbitrary commutative bases, including empty indices and zero
    rings. Their nonempty normalization is an algebra retract, not a group/Hopf
    map. The split-kernel product supplies an underlying-object isomorphism
    for any genuine group-object kernel square and arbitrary underlying-object
    section, with section-first multiplication; it is not a direct-product
    group-object isomorphism. For finite decidable matrix indices with a chosen
    pivot, the actual determinant-one kernel gives an underlying-scheme product
    SL(n,K) × Gm,K isomorphic to GL(n,K), an actual determinant triangle and
    smoothness of the actual determinant scheme morphism over arbitrary
    commutative rings, including zero rings and rank one. Rank zero,
    a canonical basis-free SL(V) scheme, arbitrary-projective-module SL,
    assumed flatness, faithful flatness and
    semidirect decomposition are not claimed.
    Complete source formalization is not claimed.

review:
  status: agent-reviewed
  notes: >-
    The library uses independent non-author agent mathematical and API review.
    The candidate contains 121 Lean modules and 27 persistent regression roots.
    The transferred finite-free SL(V) and finite GL/SL smoothness APIs have
    independent origin reviews; destination and release decisions are recorded
    separately for each exact version.
    The transferred split-kernel and determinant-product modules and their
    clients have independent origin and destination mathematical and API reviews.
    Release verification requires applicable pinned-graph module and default builds and
    a complete transitive standard-axiom audit of public/server/private compiled
    declarations, reusing unchanged evidence only where its inputs still apply.
    Exact-version review, check evidence and release decisions are recorded
    separately. Independent documentation, metadata, artifact and rights
    review and protected acceptance are not certified by this metadata.
    Origin mathematical reviews do not themselves accept a destination transfer;
    independent destination review, owner integration, release acceptance and
    publication are separate exact-version recorded decisions. Development review and schema validity do not
    establish release acceptance, human review or source-author endorsement.

acknowledgements: >-
  Lattice supplied earlier research, reusable mathematical implementations and
  integration. Distinct Formalization Worker A/B executions supplied further
  implementations and independent development reviews; Anchor supplied shared
  integration. README.md credits the original finite-free SL(V) Worker B author
  and Worker A reviewer, the finite GL/SL smoothness Worker A author, the Worker B
  destination transfer and Antoine Chambert-Loir's reused mathlib API. Origin
  and destination review/acceptance are distinct. Separate Worker B executions
  authored the generic split-kernel and finite determinant-product proofs and
  clients; a further Worker B execution prepared their destination transfer.
  README.md preserves concrete
  predecessor/contribution examples.
  External mathematical sources, formalization libraries and tools retain their
  separate contributor credit and applicable licenses and notices.
