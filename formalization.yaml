review:
  status: geometry code agent-reviewed and accepted on main; release review pending
  notes: >-
    The library uses independent non-author agent mathematical and API review.
    The predecessor's 121 Lean modules and 27 persistent regression roots have
    applicable destination build and private-inclusive standard-three axiom
    evidence at their exact inputs. The separately accepted 125-module, 29-root
    semidirect predecessor has applicable native job 530 and independent affected
    review at its exact inputs. The accepted 130-module, 31-root combined main
    graph at aa9e9326ac1673549825f0defaf32714120dd71c has successful native
    job 533: both default targets, all 130 modules and a complete private-inclusive
    transitive audit of 3268 module-origin declarations (944 private-prefix),
    permitting only propext, Classical.choice and Quot.sound. Earlier checks
    alone do not certify a changed graph.
    The transferred finite-free SL(V) and finite GL/SL smoothness APIs have
    independent origin reviews; destination and release decisions are recorded
    separately for each exact version.
    The transferred split-kernel and determinant-product modules and their
    clients have independent origin and destination mathematical and API reviews.
    The additionally transferred split-kernel semidirect and finite determinant
    conjugation modules and clients retain independent source-only transfer
    review. Native job 530, fresh affected review and owner code acceptance cover
    their accepted 125-module destination predecessor; native job 533 and fresh
    affected review also cover the accepted combined graph. Source-only transfer
    review and incubator origin evidence are not substituted for these checks.
    The accepted incubator geometric-integrality, dimension and rational-point
    height origins have an independently reviewed original source-only transfer,
    distinct from fresh independent review, native job 533 and owner code
    acceptance of this combined destination assembly. The checked computational
    inputs remain unchanged in the documentation-only release candidate.
    Exact-version review, check evidence and release decisions are recorded
    separately. Independent documentation, metadata, complete artifact/history
    and rights review and protected release acceptance remain pending; this
    candidate was then unpublished. Incubator origin, development review and schema
    validity do not establish release acceptance, source coverage, human review
    or source-author endorsement.
    Those release-preparation statements describe the predecessor's dated
    historical state, not the status of the now-published predecessor snapshot.
    The newly transferred upper-unitriangular proof bodies and ordinary-import
    client have distinct agent origin and affected-assembly reviews, but neither
    those reviews nor the predecessor's native job 533 certify this changed
    destination graph. Native job 682 on 2026-09-28 successfully built both
    configured default targets (3471 jobs) and audited all 133 modules and
    3404 module-origin declarations, including 955 private-named declarations,
    permitting only propext, Classical.choice and Quot.sound. Fresh independent
    destination review and maintainer code acceptance cover exact snapshot
    7ad131de3c5a7696df678e944aaa20c1defbb397. Its preparation changed four of its
    150 recorded file tuples, all documentation or metadata; all Lean, toolchain,
    build, dependency and checker inputs and twelve resolved packages remain
    unchanged. At preparation, independent release review, protected release
    acceptance and publication were then pending; that predecessor has since
    been released and verified on the official private GitHub main. The new
    geometry producer and 21 ordinary-import examples have an independently
    reviewed isolated origin, distinct from their subsequent destination review.
    Native job 718 on 2026-09-28 successfully fetched the matching mathlib cache,
    built both default targets (3473 jobs) and completed the full transitive
    standard-three axiom audit for all 135 modules: 3419 actual-origin
    declarations including 956 private-named, with no additional axioms.
    Geometry has 15 actual declarations, including generated and private names;
    its twelve selected rows do not exhaust that census. Fresh author-distinct
    destination transfer review and owner code acceptance/protected integration
    cover exact main commit 31492d5a182c21f40af029121718ceca8085568a.
    The preceding official private GitHub release
    20939506447f61a3f383cc67e76802fd4a2fbb75 has coordinate/group but
    not geometry. Only documentation and metadata change in this preparation;
    checked Lean, build, dependency and checker inputs remain identical, though
    the old whole-153-file input digest does not describe the updated documents.
    Independent release review, protected release acceptance and verified
    geometry publication remain pending. No source coverage is upgraded.

acknowledgements: >-
  Lattice supplied earlier research, reusable mathematical implementations and
  integration. Distinct Formalization Worker A/B executions supplied further
  implementations and independent development reviews; Anchor supplied shared
  integration. README.md credits the original finite-free SL(V) Worker B author
  and Worker A reviewer, the finite GL/SL smoothness Worker A author, the Worker B
  destination transfer and Antoine Chambert-Loir's reused mathlib API. Origin
  and destination review/acceptance are distinct. Separate Worker B executions
  authored the generic split-kernel and finite determinant-product proofs and
  clients; a further Worker B execution prepared their destination transfer.
  Distinct Worker B executions authored the split-kernel conjugation and finite
  determinant-conjugation proofs and clients; another Worker B execution
  prepared their destination import and namespace transfer.
  Separate Worker B executions researched and authored the finite GL/SL
  geometric-integrality and dimension proofs and clients, reusing Worker A's
  earlier normalization section. A distinct Worker B execution prepared this
  destination import and client-namespace transfer. README.md records their
  distinct roles; incubator acceptance is not destination review or publication.
  README.md preserves concrete
  predecessor/contribution examples.
  External mathematical sources, formalization libraries and tools retain their
  separate contributor credit and applicable licenses and notices.
  An original Worker B execution authored the upper-unitriangular proof bodies
  and client, with a distinct Worker A isolated-proof reviewer. A separate
  Worker B execution assembled their original registration, independently
  reviewed for affected API by another Worker A execution. A further Worker B
  execution prepared this destination transfer. Another independent Worker A
  execution supplied destination review, followed by Lattice's code acceptance
  and documentation-only release-readiness preparation. These agent roles are
  not human review or release acceptance. A separate original Worker B execution
  authored the new unitriangular geometry producer and client; a distinct Worker A
  execution independently reviewed their isolated proof bodies. A separate
  Worker B execution transferred those bodies and examples into the destination;
  another Worker A execution independently reviewed the exact transfer, followed
  by Lattice's code acceptance/protected integration. A further Worker B execution
  prepared the documentation-only geometry-release candidate. These steps are
  distinct from still-pending independent release acceptance and publication.
