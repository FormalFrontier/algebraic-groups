name = "algebraic-groups"
version = "0.1.0"
defaultTargets = ["AlgebraicGroups", "AlgebraicGroupsTest"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "scheme-properties"
git = "https://github.com/FormalFrontier/scheme-properties.git"
rev = "6b204a3e49f022e51d78a9f93e77513b99a87e00"

[[require]]
name = "general-linear-groups"
git = "https://github.com/FormalFrontier/general-linear-groups.git"
rev = "ad7c50a0523441116537fb1d6e3c8d2a665af1fc"

[[lean_lib]]
name = "AlgebraicGroups"

[[lean_lib]]
name = "AlgebraicGroupsTest"
roots = [
  "AlgebraicGroupsTest.Additive",
  "AlgebraicGroupsTest.AdditivePowerQuotient",
  "AlgebraicGroupsTest.ArtinSchreierTwistedLine",
  "AlgebraicGroupsTest.FiniteConstantPoints",
  "AlgebraicGroupsTest.GeneralLinear",
  "AlgebraicGroupsTest.GeneralLinearDeterminant",
  "AlgebraicGroupsTest.GeneralLinearDeterminantProduct",
  "AlgebraicGroupsTest.GeneralLinearDeterminantConjugation",
  "AlgebraicGroupsTest.GeneralLinearDeterminantSection",
  "AlgebraicGroupsTest.GeneralLinearModule",
  "AlgebraicGroupsTest.GeneralSpecialLinearDimension",
  "AlgebraicGroupsTest.GeneralSpecialLinearGeometricIntegral",
  "AlgebraicGroupsTest.GeneralSpecialLinearSmooth",
  "AlgebraicGroupsTest.InfinitesimalAdditive",
  "AlgebraicGroupsTest.InfinitesimalAdditiveNonisomorphism",
  "AlgebraicGroupsTest.InfinitesimalAdditiveTranslation",
  "AlgebraicGroupsTest.InfinitesimalAdditiveZero",
  "AlgebraicGroupsTest.MatrixEndAdditive",
  "AlgebraicGroupsTest.MatrixEndBaseChange",
  "AlgebraicGroupsTest.MatrixEndScheme",
  "AlgebraicGroupsTest.MonoidAlgebraPrimitive",
  "AlgebraicGroupsTest.Multiplicative",
  "AlgebraicGroupsTest.PrimitivePowerHopfIdeal",
  "AlgebraicGroupsTest.SymmetricAlgebra",
  "AlgebraicGroupsTest.SpecialLinear",
  "AlgebraicGroupsTest.SpecialLinearModule",
  "AlgebraicGroupsTest.SplitKernelProduct",
  "AlgebraicGroupsTest.SplitKernelSemidirect",
  "AlgebraicGroupsTest.TargetCopy",
  "AlgebraicGroupsTest.Unitriangular",
  "AlgebraicGroupsTest.UnitriangularGeometry",
  "AlgebraicGroupsTest.Vector",
  "AlgebraicGroupsTest.VectorProduct",
