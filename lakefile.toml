name = "algebraic-groups"
version = "0.1.0"
defaultTargets = ["AlgebraicGroups", "AlgebraicGroupsTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "scheme-properties"
git = "https://github.com/FormalFrontier/scheme-properties.git"
rev = "c3ce429677a7c4a342b134a881f99cacfc62f71e"

[[require]]
name = "general-linear-groups"
git = "https://github.com/FormalFrontier/general-linear-groups.git"
rev = "8b3b07bf2744a870b53934542e4c5ed383765bd6"

[[require]]
name = "coherent-modules"
git = "https://github.com/FormalFrontier/coherent-modules.git"
rev = "1112034c447b07049c12402ce0f3f25c4cffb5e4"

[[lean_lib]]
name = "AlgebraicGroups"

